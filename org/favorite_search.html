<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOLI - 취향설정 (아티스트 검색)</title>

  <!-- 공통 스타일 + 이 화면 전용 스타일만 로드 (favorite.css를 그대로 재사용) -->
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/favorite.css" />
</head>
<body>
  <div class="app-shell">
    <!-- favorite.js의 아티스트 검색 서브스텝을 그대로 재사용합니다.
         (favorite.html과 로직/스타일을 공유하고, 진입 시 바로 "artist" 단계로 이동만 시킵니다) -->
    <section id="screen-favorite" class="screen active"></section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/router.js"></script>
  <script src="js/common.js"></script>
  <script src="js/favorite.js"></script>
  <script>
    // 이 파일은 취향설정 플로우 중 "아티스트 검색" 화면만 바로 보여주기 위한 개별 리뷰용 파일입니다.
    // 첨부 이미지(4번)와 동일한 초기 상태를 재현하기 위해,
    // 아직 아무 아티스트도 선택하지 않은 상태로 시작하고 검색어를 "이준영"으로 미리 채워둡니다.
    document.addEventListener("DOMContentLoaded", () => {
      const { selectedArtists } = window.NOLI_DATA.userPreference;
      selectedArtists.splice(0, selectedArtists.length);

      NOLI_FAVORITE.goToStep("artist");

      const input = document.querySelector('[data-action="artist-query"]');
      if (input) {
        input.value = "이준영";
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
    });
  </script>
</body>
</html>
