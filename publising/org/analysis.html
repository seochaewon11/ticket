<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOLI - 상세 리포트</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="analysis.css" />
</head>

<body>
  <div class="app analysis-page">

    <!-- 상단 내비게이션 -->
    <header class="analysis-topbar">
      <button class="icon-btn-plain back-btn" id="backBtn" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <h1>상세 리포트</h1>
      <button class="icon-btn-plain share-btn" id="shareBtn" aria-label="공유">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="2.6" />
          <circle cx="6" cy="12" r="2.6" />
          <circle cx="18" cy="19" r="2.6" />
          <path d="M8.3 10.7l7.4-4.2M8.3 13.3l7.4 4.2" />
        </svg>
      </button>
    </header>

    <!-- 관람 트렌드 -->
    <section class="report-card">
      <div class="trend-header">
        <div>
          <h3>관람 트렌드</h3>
          <p>지난 6개월간의 기록입니다</p>
        </div>
        <div class="trend-count">
          <span class="count-number" id="trendTotalCount">12</span>
          <span class="count-unit">회 관람</span>
        </div>
      </div>
      <div class="trend-chart" id="trendChart"></div>
    </section>

    <!-- 장르별 상세 분포 -->
    <section class="report-card">
      <h3>장르별 상세 분포</h3>
      <div class="genre-distribution-row">
        <div class="donut-wrap">
          <svg viewBox="0 0 128 128" id="donutSvg"></svg>
          <div class="donut-center">
            <span class="donut-percent" id="donutPercent"></span>
            <span class="donut-genre" id="donutGenreLabel"></span>
          </div>
        </div>
        <div class="genre-legend" id="genreLegend"></div>
      </div>
    </section>

    <!-- 최애 아티스트 랭킹 -->
    <section class="report-card">
      <h3 style="margin-bottom:14px;">최애 아티스트 랭킹</h3>
      <div class="artist-ranking-list" id="artistRankingList"></div>
    </section>

    <!-- 공유 완료 토스트 -->
    <div class="toast" id="toast"></div>

    <!-- 하단 고정 액션바 + 탭바 -->
    <div class="analysis-action-bar">
      <button class="btn btn-primary share-report-btn" id="shareReportBtn">리포트 친구에게 공유하기</button>
      <nav class="bottom-nav analysis-nav" aria-label="주요 메뉴">
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span class="nav-label">홈</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M20 20l-4.5-4.5" stroke-linecap="round" />
          </svg>
          <span class="nav-label">탐색</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <path d="M4 9.5h16M8 3v3.5M16 3v3.5" stroke-linecap="round" />
          </svg>
          <span class="nav-label">캘린더</span>
        </button>
        <button class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 19V10M12 19V5M19 19v-6" stroke-linecap="round" />
          </svg>
          <span class="nav-label">분석</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="3.4" />
            <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" />
          </svg>
          <span class="nav-label">프로필</span>
        </button>
      </nav>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="analysis.js"></script>
</body>

</html>
