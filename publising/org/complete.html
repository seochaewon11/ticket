<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOLI - 설정 완료</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="complete.css" />
</head>

<body>
  <div class="app complete-page">

    <!-- 배경 도트 파티클 (장식용, 순수 CSS) -->
    <div class="dot-particles" aria-hidden="true">
      <span
        style="position:absolute; top:6%;  left:48%; width:6px;  height:6px;  border-radius:50%; background:#A78BFA; opacity:0.55;"></span>
      <span
        style="position:absolute; top:14%; left:13%; width:9px;  height:9px;  border-radius:50%; background:#A78BFA; opacity:0.35;"></span>
      <span
        style="position:absolute; top:20%; left:82%; width:6px;  height:6px;  border-radius:50%; background:#F0A6B8; opacity:0.45;"></span>
      <span
        style="position:absolute; top:28%; left:6%;  width:4px;  height:4px;  border-radius:50%; background:#F0A6B8; opacity:0.5;"></span>
      <span
        style="position:absolute; top:33%; left:92%; width:7px;  height:7px;  border-radius:50%; background:#C9B8FB; opacity:0.4;"></span>
      <span
        style="position:absolute; top:40%; left:22%; width:5px;  height:5px;  border-radius:50%; background:#A78BFA; opacity:0.3;"></span>
      <span
        style="position:absolute; top:38%; left:70%; width:4px;  height:4px;  border-radius:50%; background:#F6C9C0; opacity:0.55;"></span>
      <span
        style="position:absolute; top:66%; left:9%;  width:6px;  height:6px;  border-radius:50%; background:#C9B8FB; opacity:0.4;"></span>
      <span
        style="position:absolute; top:70%; left:88%; width:5px;  height:5px;  border-radius:50%; background:#A78BFA; opacity:0.4;"></span>
      <span
        style="position:absolute; top:80%; left:16%; width:4px;  height:4px;  border-radius:50%; background:#F0A6B8; opacity:0.5;"></span>
      <span
        style="position:absolute; top:85%; left:80%; width:8px;  height:8px;  border-radius:50%; background:#F6C9C0; opacity:0.35;"></span>
      <span
        style="position:absolute; top:92%; left:40%; width:5px;  height:5px;  border-radius:50%; background:#A78BFA; opacity:0.4;"></span>
      <span
        style="position:absolute; top:11%; left:63%; width:4px;  height:4px;  border-radius:50%; background:#C9B8FB; opacity:0.45;"></span>
      <span
        style="position:absolute; top:58%; left:50%; width:3px;  height:3px;  border-radius:50%; background:#F0A6B8; opacity:0.4;"></span>
    </div>

    <!-- 상단 진행 표시 -->
    <header class="complete-topbar">
      <div class="step-progress">
        <span class="step is-filled"></span>
        <span class="step is-filled"></span>
        <span class="step is-filled"></span>
      </div>
      <p class="step-label">Step 3 of 3</p>
    </header>

    <main class="complete-content">

      <!-- 완료 메시지 -->
      <section class="complete-message">
        <img class="complete-logo" src="img/logo.png" alt="NOLI" />
        <h1>설정이 완료되었습니다!</h1>
        <p id="completeSub">이제 NOLI가 소연님의 취향을 찾았어요.</p>
      </section>

      <!-- TASTE ANALYSIS 카드 -->
      <section class="taste-card">
        <p class="taste-label">TASTE ANALYSIS</p>
        <h2 class="taste-title" id="tasteTitle">소연님을 위한 맞춤 공연을 준비했어요</h2>
        <div class="taste-tags" id="tasteTags"></div>
      </section>

      <!-- 안내 문구 -->
      <p class="complete-note" id="completeNote">
        소연 님이 좋아할만한 공연 정보들을 매일 아침 배달해 드릴게요! 💌
      </p>

    </main>

    <!-- 하단 CTA -->
    <div class="complete-cta">
      <button class="btn btn-primary" id="startBtn">
        공연 일정 바로가기
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button class="btn btn-outline" id="goHomeBtn">홈으로 바로가기</button>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="complete.js"></script>
</body>

</html>
