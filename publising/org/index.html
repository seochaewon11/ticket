<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOLI - 오늘의 추천</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="app index-page">

    <!-- 상단 헤더 -->
    <header class="header">
      <h1 class="logo"><img src="img/logo.png" alt="NOLI" /></h1>
      <button class="settings-btn" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path
            d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.4-2-3.4-2.2.8a7.7 7.7 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.7 7.7 0 0 0-2.6 1.5l-2.2-.8-2 3.4L4.6 10.5a7.6 7.6 0 0 0 0 3L2.7 15l2 3.4 2.2-.8c.75.65 1.63 1.15 2.6 1.5l.5 2.4h4l.5-2.5a7.7 7.7 0 0 0 2.6-1.5l2.2.8 2-3.4-1.9-1.4z">
          </path>
        </svg>
      </button>
    </header>

    <main class="main-content">

      <!-- 타이틀 영역 -->
      <section class="intro">
        <h2>오늘의 추천</h2>
        <p>나의 감성을 채워줄 오늘의 무대</p>
      </section>

      <!-- 추천 섹션 -->
      <section class="recommend-section">
        <div class="section-header">
          <h3><span id="userName">소연</span>님 취향 추천</h3>
          <a href="#" class="more-link">더보기 &gt;</a>
        </div>

        <!-- 추천 카드: index.js에서 동적 렌더링 -->
        <article class="recommend-card card" id="recommendCard" aria-live="polite"></article>

        <div class="cta-group">
          <button class="btn btn-primary" id="addToWishlistBtn">
            <span class="btn-icon">🔖</span> 공연보관함에 담기
          </button>
          <button class="btn btn-outline" id="detailBtn">
            공연 상세 정보 보기
          </button>
        </div>
      </section>

      <!-- 나의 공연 플레이리스트 -->
      <section class="playlist-section">
        <h3 class="section-title">나의 공연 플레이리스트</h3>

        <ul class="playlist-list">
          <li class="playlist-item card">
            <span class="playlist-icon wish-icon">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 20.5s-7.5-4.6-10-9.1C.4 8.2 2 4.8 5.4 4.1c2-.4 3.9.5 5 2.1 1.1-1.6 3-2.5 5-2.1 3.4.7 5 4.1 3.4 7.3-2.5 4.5-10 9.1-10 9.1z" />
              </svg>
            </span>
            <div class="playlist-info">
              <p class="playlist-label">보고 싶은 공연</p>
              <p class="playlist-count wish" id="wishCount">12개</p>
            </div>
            <span class="chevron">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M9 6l6 6-6 6" />
              </svg>
            </span>
          </li>

          <li class="playlist-item card">
            <span class="playlist-icon watched-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z" />
                <line x1="10" y1="6" x2="10" y2="18" stroke-dasharray="2 2" />
              </svg>
            </span>
            <div class="playlist-info">
              <p class="playlist-label">관람 완료 공연</p>
              <p class="playlist-count watched" id="watchedCount">24개</p>
            </div>
            <span class="chevron">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M9 6l6 6-6 6" />
              </svg>
            </span>
          </li>
        </ul>
      </section>

    </main>

    <!-- 하단 탭바 -->
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span class="nav-label">홈</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M20 20l-4.5-4.5" stroke-linecap="round" />
        </svg>
        <span class="nav-label">탐색</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="5" width="16" height="15" rx="2" />
          <path d="M4 9.5h16M8 3v3.5M16 3v3.5" stroke-linecap="round" />
        </svg>
        <span class="nav-label">캘린더</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 19V10M12 19V5M19 19v-6" stroke-linecap="round" />
        </svg>
        <span class="nav-label">분석</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="3.4" />
          <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" />
        </svg>
        <span class="nav-label">프로필</span>
      </button>
    </nav>

  </div>

  <script src="data.js"></script>
  <script src="index.js"></script>
</body>

</html>
