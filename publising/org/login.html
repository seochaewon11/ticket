<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOLI - 로그인</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="app login-page">

    <!-- 상단 브랜딩 -->
    <div class="login-brand">
      <img class="login-logo-img" src="img/logo.png" alt="NOLI" />
      <h1>반가워요!</h1>
      <p>더 즐거운 문화생활의 시작, 노리</p>
    </div>

    <!-- 일러스트 카드 -->
    <div class="login-illustration">
      <img class="login-illustration-img" src="img/login.png" alt="" />
    </div>

    <!-- 소셜 및 이메일 로그인 버튼 그룹 -->
    <div class="login-buttons">
      <button type="button" class="login-btn login-btn-google">
        <svg viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" />
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" />
          <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" />
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" />
        </svg>
        구글로 로그인
      </button>
      <button type="button" class="login-btn login-btn-kakao">
        <svg viewBox="0 0 24 24" fill="#3A2E00">
          <path d="M12 3C6.48 3 2 6.48 2 10.7c0 2.68 1.8 5.04 4.53 6.4-.2.75-.73 2.7-.84 3.13-.13.53.2.52.42.38.17-.11 2.7-1.83 3.8-2.58.68.1 1.38.15 2.09.15 5.52 0 10-3.48 10-7.48S17.52 3 12 3z" />
        </svg>
        카카오로 로그인
      </button>
      <button type="button" class="login-btn login-btn-naver">
        <svg viewBox="0 0 24 24" fill="var(--color-white)">
          <path d="M16.5 3v9.6L7.8 3H3v18h5.7v-9.6l8.7 9.6H21V3h-4.5z" />
        </svg>
        네이버로 로그인
      </button>
      <button type="button" class="login-btn login-btn-email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        이메일로 로그인
      </button>
    </div>

    <!-- 하단 링크 -->
    <div class="login-links">
      <a href="#">회원가입</a>
      <span class="dot-sep">·</span>
      <a href="#">비밀번호 찾기</a>
    </div>

    <!-- 법적 고지 -->
    <p class="login-legal">
      계속 진행함으로써 NOLI의 <a href="#">이용약관</a> 및<br />
      <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
    </p>

  </div>

  <script src="data.js"></script>
  <script src="login.js"></script>
</body>

</html>
