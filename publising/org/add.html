<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOLI - 취향설정</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="add.css" />
</head>

<body>
  <div class="app add-page">

    <!-- 상단바 -->
    <header class="add-topbar">
      <button class="back-btn" id="backBtn" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <img class="mini-logo" src="img/logo.png" alt="NOLI" />
      <div class="topbar-spacer"></div>
    </header>

    <!-- 진행 표시 -->
    <div class="step-progress">
      <span class="step is-filled"></span>
      <span class="step"></span>
      <span class="step"></span>
    </div>
    <div class="step-meta">
      <span class="step-label">Step 1 of 3</span>

    </div>

    <!-- 타이틀 -->
    <section class="add-title">
      <h2>어떤 공연을 좋아하세요?</h2>
      <p>취향에 맞는 공연을 추천해 드릴게요.</p>
    </section>

    <!-- 장르 선택 그리드: add.js에서 동적 렌더링 -->
    <section class="genre-grid" id="genreGrid"></section>

    <!-- 분위기 선택 -->
    <section class="mood-section">
      <h3>좋아하는 분위기는?</h3>
      <div class="mood-tags" id="moodTags"></div>
    </section>

    <!-- 하단 고정 CTA + 탭바 -->
    <div class="add-cta">
      <div class="action-buttons">
        <button class="btn btn-primary" id="nextStepBtn">
          다음 단계로
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <nav class="bottom-nav add-nav" aria-label="주요 메뉴">
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span class="nav-label">홈</span>
        </button>
        <button class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M20 20l-4.5-4.5" stroke-linecap="round" />
          </svg>
          <span class="nav-label">탐색</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <path d="M4 9.5h16M8 3v3.5M16 3v3.5" stroke-linecap="round" />
          </svg>
          <span class="nav-label">캘린더</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 19V10M12 19V5M19 19v-6" stroke-linecap="round" />
          </svg>
          <span class="nav-label">분석</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="3.4" />
            <path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" />
          </svg>
          <span class="nav-label">프로필</span>
        </button>
      </nav>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="add.js"></script>
</body>

</html>
